name: Rust checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            binary: azteccraft
          - os: windows-2025
            platform: windows
            binary: azteccraft.exe
          - os: macos-15
            platform: macos
            binary: azteccraft
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Update Linux package index
        if: runner.os == 'Linux'
        run: sudo apt-get update
      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install pinned pip
        run: python -m pip install pip==26.2.1
      - name: Install packaging check tools
        run: python -m pip install --group packaging/pyproject.toml:dev
      - name: Packaging lint
        run: python -m ruff check --config packaging/pyproject.toml packaging
      - name: Packaging format
        run: python -m ruff format --check --config packaging/pyproject.toml packaging
      - name: Packaging types
        run: python -m mypy --config-file packaging/pyproject.toml packaging/package.py packaging/tests
      - name: Packaging tests
        run: python -m pytest -c packaging/pyproject.toml packaging/tests
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
      - name: Format
        run: cargo +1.99.0 fmt --all -- --check
      - name: Clippy
        run: cargo +1.99.0 clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo +1.99.0 test --workspace --locked
      - name: Install LLVM tools
        if: runner.os == 'Linux'
        run: rustup component add llvm-tools-preview --toolchain 1.99.0
      - name: Install coverage tool
        if: runner.os == 'Linux'
        run: cargo +1.99.0 install cargo-llvm-cov --version 0.9.1 --locked
      - name: Headless library line coverage (80% minimum)
        if: runner.os == 'Linux'
        run: cargo +1.99.0 llvm-cov --no-default-features --workspace --all-targets --locked --ignore-filename-regex '(^|/)tests/' --fail-under-lines 80
      - name: Release build
        run: cargo +1.99.0 build --workspace --release --locked
      - name: Package built desktop binary
        run: python packaging/package.py --binary target/release/${{ matrix.binary }} --output target/packages --platform ${{ matrix.platform }}
      - name: Upload checked build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: azteccraft-${{ matrix.platform }}-${{ runner.arch }}-${{ github.sha }}
          path: |
            target/packages/*.zip
            target/packages/*.tar.gz
            target/packages/manifest.json
          if-no-files-found: error
          retention-days: 7
  audit:
    name: Dependency security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Install pinned cargo-audit
        run: cargo +1.99.0 install cargo-audit --version 0.22.0 --locked
      - name: Audit locked dependencies
        run: cargo +1.99.0 audit --deny warnings
